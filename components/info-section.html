<!-- Информационная секция (инсайт-карточка с маскотами и рекомендациями) -->
<!-- Включается через <object type="text/html" data="components/info-section.html"></object> -->
<div class="info-section">
  <div class="info-card" style="--aura:rgba(92,196,160,.22)">
    <div class="info-card-header">
      <div class="info-card-title">Инсайт дня</div>

    </div>

          Открыть активность
