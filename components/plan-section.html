<!-- Блок задач / планировщик -->
<!-- Включается через <object type="text/html" data="components/plan-section.html"></object> -->
<div class="plan-section">
  <!-- План на сегодня -->
  <div class="card plan-today-card" style="--aura:rgba(92,196,160,.22)">
    <div class="plan-header">
      <div class="plan-title">План на сегодня</div>
      <div class="plan-meta">3 задачи · 2 завершено</div>
    </div>
    <div class="plan-list" id="planList">
      <div class="plan-item done">
        <div class="plan-check">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5CC4A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="plan-text">
          <div class="plan-label">Замес пробежки — 5 км</div>
          <div class="plan-time">06:30 · 32 мин</div>
        </div>
      </div>
      <div class="plan-item done">
        <div class="plan-check">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5CC4A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="plan-text">
          <div class="plan-label">Завтрак — белковый</div>
          <div class="plan-time">07:15 · 15 мин</div>
        </div>
      </div>
      <div class="plan-item active">
        <div class="plan-check">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2FBF9B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        </div>
        <div class="plan-text">
          <div class="plan-label">Тренировка — верх тела</div>
          <div class="plan-time">18:00 · 45 мин</div>
        </div>
      </div>
      <div class="plan-item">
        <div class="plan-check">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9BFB2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        </div>
        <div class="plan-text">
          <div class="plan-label">Прогулка после работы</div>
          <div class="plan-time">19:30 · 20 мин</div>
        </div>
      </div>
    </div>
    <button class="plan-add-btn" onclick="openTaskModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Добавить задачу
    </button>
  </div>
</div>
