<!-- SVG Definitions — Atlas Health
     Все градиенты, фильтры и повторно используемые SVG-иконки.
     Включается через <object type="text/html" data="components/svg-defs.html"></object>
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Градиенты для кольца готовности -->
    <linearGradient id="statusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CC4A0"/>
      <stop offset="50%" stop-color="#2FBF9B"/>
      <stop offset="100%" stop-color="#1A9E7A"/>
    </linearGradient>

    <!-- Градиенты для кольца активности -->
    <linearGradient id="activityRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FE8CB"/>
      <stop offset="50%" stop-color="#5CCAA5"/>
      <stop offset="100%" stop-color="#1A9E7A"/>
    </linearGradient>
    <linearGradient id="activityRingShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Градиенты для графиков дня -->
    <linearGradient id="dayAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2FBF9B" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2FBF9B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2FBF9B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="focusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E88060"/>
      <stop offset="100%" stop-color="#E86E5E"/>
    </linearGradient>
    <linearGradient id="productivityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CC4A0"/>
      <stop offset="100%" stop-color="#2FBF9B"/>
    </linearGradient>

    <!-- Фильтры -->
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#2D2823" flood-opacity="0.08"/>
    </filter>
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="areaGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="activityRingShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A9E7A" flood-opacity="0.25"/>
    </filter>
    <filter id="activityRingGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>

<!-- Повторно используемые SVG-иконки (inline, без размера — размер задаётся в CSS/атрибуте) -->
<template id="icon-set">
  <!-- Theme toggle (солнце/луна) -->
  <svg id="icon-theme" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>

  <!-- Информационный тултип -->
  <svg id="icon-info" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 16v-4M12 8h.01"/>
  </svg>

  <!-- Стрелка-тренд вверх -->
  <svg id="icon-trend-up" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>

  <!-- Стрелка-тренд вверх (крупная) -->
  <svg id="icon-trend-up-lg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>

  <!-- Пик (пик-индикатор) -->
  <svg id="icon-peak" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 8v4l3 3"/>
  </svg>

  <!-- Прогноз (стрелка-фильц) -->
  <svg id="icon-forecast" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 12h14M12 5l7 7-7 7"/>
  </svg>

  <!-- Солнце (иконка погоды) -->
  <svg id="icon-sun" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="5"/>
    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
  </svg>

  <!-- Речевой пузырь -->
  <svg id="icon-speech-bubble" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>

  <!-- Кружок-прогресс (стрелка вверх + стрелка-фильц, комбинированная) -->
  <svg id="icon-progress-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#2FBF9B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>

  <!-- Кружок-пик -->
  <svg id="icon-progress-peak" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 8v4l3 3"/>
  </svg>

  <!-- Кружок-прогноз -->
  <svg id="icon-progress-forecast" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M5 12h14M12 5l7 7-7 7"/>
  </svg>

  <!-- Помодоро таймер иконка -->
  <svg id="icon-pomodoro" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E86E5E" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 6v6l4 2"/>
  </svg>
</template>
